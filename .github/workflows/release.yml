name: Release build

on:
  push:
    branches: [master, main]

permissions:
  contents: write # needed to create releases and tags

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Same format as BuildStamp in PSPSuite.csproj; passed in so the zip name matches the binary's version
      - name: Stamp
        run: echo "BUILD_STAMP=$(date -u +%y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Publish
        run: >
          dotnet publish PSPSuite.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishReadyToRun=true -p:PublishSingleFile=false
          -p:BuildStamp=${{ env.BUILD_STAMP }}
          -o out/${{ matrix.rid }}

      - name: Zip
        run: cd out/${{ matrix.rid }} && zip -r ../../PSPSuite-${{ env.BUILD_STAMP }}-${{ matrix.rid }}.zip .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: PSPSuite-${{ env.BUILD_STAMP }}
          name: PSPSuite-${{ env.BUILD_STAMP }}
          target_commitish: ${{ github.sha }}
          files: PSPSuite-${{ env.BUILD_STAMP }}-${{ matrix.rid }}.zip
